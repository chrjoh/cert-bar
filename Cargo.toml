[package]
name = "cert-bar"
version = "0.1.0"
edition = "2024"
[features]
default = []
pqc = ["cert-helper/pqc"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
cert-helper = "0.5.3"
chrono = "0.4.41"
clap = { version = "4.5.41", features = ["derive"] }
cms = { version = "0.3.0-rc.2", features = ["builder"] }
config = { version = "0.15.11", features = ["yaml"] }
mockall = "0.13.1"
num-bigint = "0.5.1"
num-traits = "0.2.19"
rsa = "0.10"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
tempfile = "3.20.0"
der = "0.8"
sha2 = { version = "0.11", features = ["oid"] }
spki = "0.8"
x509-cert = "0.3"
p256 = { version = "0.14", features = ["ecdsa", "pem"] }
p384 = { version = "0.14", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.17", features = ["algorithm", "digest"] }
hex = "0.4.3"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
